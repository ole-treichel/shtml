name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose
    - name: Run tests (chaos)
      run: cargo test --verbose --features chaos
    - name: Run tests (context)
      run: cargo test --verbose --features context
    - name: Run tests (chaos + context)
      run: cargo test --verbose --features chaos,context
